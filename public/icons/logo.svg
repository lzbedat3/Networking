<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Darb family: forest green block, cream arch, gold inner wall. The arch is a gateway the route passes through. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14503b"/>
      <stop offset="1" stop-color="#0b2f23"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c968"/>
      <stop offset="1" stop-color="#c8922c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g)"/>
  <!-- gold inner wall of the arch -->
  <path d="M206 404V226a70 70 0 0 1 140 0v178" fill="none" stroke="url(#gold)" stroke-width="58" stroke-linecap="round"/>
  <!-- cream ribbon arch in front -->
  <path d="M166 404V220a90 90 0 0 1 180 0" fill="none" stroke="#f4eedf" stroke-width="52" stroke-linecap="round"/>
  <!-- the route: hops passing through the gate -->
  <path d="M96 338h300" stroke="#0b2f23" stroke-width="22" stroke-linecap="round"/>
  <path d="M96 338h300" stroke="#f4eedf" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 26"/>
  <circle cx="96" cy="338" r="20" fill="#f4eedf"/>
  <circle cx="416" cy="338" r="24" fill="url(#gold)" stroke="#0b2f23" stroke-width="8"/>
</svg>
